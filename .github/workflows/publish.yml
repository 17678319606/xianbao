name: xianbao-push

on:
  schedule:
    # 最短合规间隔 = 每 5 分钟（GitHub cron 最小粒度即 5 分钟）。
    # 源站线报酷限制"持续轮询≥5秒"，而本工作流每次运行只 GET 一次 push.json，
    # 每 5 分钟才请求一次，远低于下限，不会封 IP —— 合规且最快。
    # 注意：必须保持仓库为【公开】，公开库 Linux 分钟无限；
    # 若设为私有库，每 5 分钟会超 2000 分/月免费额度，私有库请改用 "0 * * * *"（每小时）。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」测试/探针

permissions:
  contents: write         # 允许提交 posted.json 去重状态文件（用内置 GITHUB_TOKEN，无需额外配置）

concurrency:
  group: xianbao-push
  cancel-in-progress: false   # 串行执行，防止并发覆盖状态文件（审查修2）

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python main.py

      - name: Commit state (retry on network jitter)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet && echo "no state change, skip" && exit 0
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git commit -m "chore: update posted state" && git push; then
              echo "state committed & pushed (attempt $i)"
              break
            fi
            echo "[WARN] push failed attempt $i, retry after 5s"
            sleep 5
          done
