name: xianbao-push

# 说明：自 2026-08 起，运行时已迁移到用户自有 1H1G 国内服务器（宝塔计划任务 / systemd），
# 每 5 分钟精确执行，不再依赖 GitHub Actions 定时（其 cron 为尽力而为，高峰期会延迟/
# 跳过，且仓库 60 天无人工活动会自动禁用定时，导致"很久收不到更新"）。
# 故此处【默认关闭 schedule】，仅保留手动触发（workflow_dispatch）作为应急探针/回退。
# 如需把 GitHub 当备用源：把下方 schedule 注释取消即可，但注意可能与服务器双发
# （WP 侧同标题+同分类兜底去重可缓解，但不建议常态双跑）。

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」测试/探针

permissions:
  contents: write         # 仅手动跑时才提交状态；服务器版不依赖此提交

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python main.py

      - name: Commit state (retry on network jitter)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet && echo "no state change, skip" && exit 0
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git commit -m "chore: update posted state" && git push; then
              echo "state committed & pushed (attempt $i)"
              break
            fi
            echo "[WARN] push failed attempt $i, retry after 5s"
            sleep 5
          done
